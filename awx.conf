# AWX Configuration File
# Copy this file and customize settings before installation
# Usage: source awx.conf && sudo -E ./install_awx.sh

################################################################################
# AWX Configuration
################################################################################

# AWX Operator version to install
# Check available versions: https://github.com/ansible/awx-operator/releases
export AWX_VERSION="2.19.1"

# AWX instance name
export AWX_INSTANCE_NAME="awx"

# Kubernetes namespace for AWX
export AWX_NAMESPACE="awx"

################################################################################
# Admin User Configuration
################################################################################

# Admin username (default: admin)
export ADMIN_USER="admin"

# Admin password (leave empty for auto-generation)
# Example: export ADMIN_PASSWORD="MySecurePassword123!"
export ADMIN_PASSWORD=""

################################################################################
# K3s Configuration
################################################################################

# K3s version (leave empty for latest stable)
# Example: export K3S_VERSION="v1.28.5+k3s1"
export K3S_VERSION=""

# Skip K3s installation if already present
# export SKIP_K3S=true

################################################################################
# Resource Limits
################################################################################

# PostgreSQL storage size (default: 8Gi)
export POSTGRES_STORAGE_SIZE="8Gi"

# Projects persistence (default: false)
# K3s local-path storage only supports ReadWriteOnce (RWO)
# AWX projects volume requires ReadWriteMany (RWX) to be mounted by both web and task pods
# Set to 'true' only if using NFS or other RWX-capable storage class
export PROJECTS_PERSISTENCE="false"

# Projects storage size (only used if PROJECTS_PERSISTENCE=true)
export PROJECTS_STORAGE_SIZE="8Gi"

# Projects storage class (only used if PROJECTS_PERSISTENCE=true)
# For NFS: export PROJECTS_STORAGE_CLASS="nfs-client"
export PROJECTS_STORAGE_CLASS="local-path"

# Web service resources
export WEB_CPU_REQUEST="500m"
export WEB_MEMORY_REQUEST="2Gi"
export WEB_CPU_LIMIT="1000m"
export WEB_MEMORY_LIMIT="4Gi"

# Task service resources
export TASK_CPU_REQUEST="500m"
export TASK_MEMORY_REQUEST="2Gi"
export TASK_CPU_LIMIT="1000m"
export TASK_MEMORY_LIMIT="4Gi"

# Execution environment resources
export EE_CPU_REQUEST="500m"
export EE_MEMORY_REQUEST="1Gi"
export EE_CPU_LIMIT="1000m"
export EE_MEMORY_LIMIT="2Gi"

################################################################################
# Network Configuration
################################################################################

# Service type: NodePort, LoadBalancer, or ClusterIP
export SERVICE_TYPE="NodePort"

# NodePort (only if SERVICE_TYPE=NodePort, range: 30000-32767)
export NODEPORT="30080"

################################################################################
# Database Configuration
################################################################################

# Use external PostgreSQL database (default: false - uses internal)
export USE_EXTERNAL_DB=false

# External database settings (only if USE_EXTERNAL_DB=true)
export EXTERNAL_DB_HOST=""
export EXTERNAL_DB_PORT="5432"
export EXTERNAL_DB_NAME="awx"
export EXTERNAL_DB_USER="awx"
export EXTERNAL_DB_PASSWORD=""

################################################################################
# Advanced Options
################################################################################

# Enable verbose logging during installation
# export VERBOSE=true

# Log file location
export LOG_FILE="/var/log/awx-install.log"

# Container image repository (use custom registry)
# export IMAGE_PULL_POLICY="IfNotPresent"
# export AWX_IMAGE="quay.io/ansible/awx"
# export AWX_EE_IMAGE="quay.io/ansible/awx-ee"

################################################################################
# TLS/SSL Configuration
################################################################################

# Enable TLS (requires ingress controller and cert-manager)
export ENABLE_TLS=false

# TLS certificate and key paths (if ENABLE_TLS=true)
export TLS_CERT_PATH=""
export TLS_KEY_PATH=""

# Hostname for TLS certificate
export HOSTNAME=""

################################################################################
# Backup Configuration
################################################################################

# Enable automatic backups
export ENABLE_BACKUPS=false

# Backup schedule (cron format)
export BACKUP_SCHEDULE="0 2 * * *"  # Daily at 2 AM

# Backup retention (days)
export BACKUP_RETENTION_DAYS=7

################################################################################
# Notes
################################################################################
# 
# Usage:
#   1. Copy this file: cp awx.conf awx.conf.local
#   2. Edit awx.conf.local with your settings
#   3. Source and run: source awx.conf.local && sudo -E ./install_awx.sh
#
# Production Recommendations:
#   - Set a strong ADMIN_PASSWORD
#   - Use external PostgreSQL database
#   - Increase resource limits based on workload
#   - Enable TLS for production use
#   - Configure regular backups
#   - Use LoadBalancer service type if on cloud
#
################################################################################
